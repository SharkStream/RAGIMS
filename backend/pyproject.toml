[tool.poetry]
name = "ragims-backend"
version = "0.1.0"
description = "RAG Ingestion Management System - FastAPI backend"
authors = ["RAGIMS <dev@ragims.local>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.30.0", extras = ["standard"] }
sqlalchemy = ">=2.0.30"
alembic = ">=1.13.0"
pydantic = ">=2.7.0"
pydantic-settings = ">=2.3.0"
celery = ">=5.4.0"
redis = ">=5.0.0"
pymysql = ">=1.1.0"
cryptography = ">=42.0.0"
minio = ">=7.2.0"
qdrant-client = ">=1.10.0"
openai = ">=1.40.0"
pymupdf = ">=1.24.0"
python-docx = ">=1.1.0"
chardet = ">=5.2.0"
tiktoken = ">=0.7.0"
loguru = ">=0.7.0"
python-multipart = ">=0.0.9"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.5.0"
black = ">=24.0.0"
mypy = ">=1.10.0"
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
pre-commit = ">=3.7.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["app"]
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]  # line length is enforced by black

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
