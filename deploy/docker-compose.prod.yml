name: ragims-prod

# I3 · 生产部署示例（指示性文件，默认不随本地开发使用）。
#
# 手工启动步骤（在 deploy/ 目录下）：
#   1. cp .env.example .env 并填入真实凭据（MySQL/Redis/MinIO/OPENAI__API_KEY）
#   2. docker compose -f docker-compose.prod.yml up -d mysql redis qdrant minio
#   3. 等 healthcheck 全绿后（docker compose -f docker-compose.prod.yml ps）：
#        docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head
#        docker compose -f docker-compose.prod.yml run --rm backend python scripts/seed.py
#        docker compose -f docker-compose.prod.yml run --rm backend python scripts/init_qdrant.py
#   4. docker compose -f docker-compose.prod.yml up -d backend worker flower
#
# 与本地 compose 的差异：无 --reload、资源限制、无代码卷挂载（镜像内代码）、
# 独立命名卷前缀、worker 可水平扩容（--scale worker=N）。

x-backend-env: &backend-env
  APP__LOG_LEVEL: "INFO"
  APP__DEBUG: "false"
  APP__CORS_ORIGINS: ${APP__CORS_ORIGINS:-["http://localhost:5173"]}
  OPENAI__API_KEY: ${OPENAI__API_KEY:?set in deploy/.env}
  OPENAI__BASE_URL: ${OPENAI__BASE_URL:-https://api.openai.com/v1}
  OPENAI__EMBEDDING_MODEL: ${OPENAI__EMBEDDING_MODEL:-text-embedding-3-small}
  OPENAI__EMBEDDING_DIMENSION: ${OPENAI__EMBEDDING_DIMENSION:-1536}
  MYSQL__HOST: mysql
  MYSQL__PORT: "3306"
  MYSQL__USER: ${MYSQL_APP_USER:-ragims}
  MYSQL__PASSWORD: ${MYSQL_APP_PASSWORD:?set in deploy/.env}
  MYSQL__DATABASE: ${MYSQL_DATABASE:-ragims}
  MYSQL__POOL_SIZE: "10"
  REDIS__HOST: redis
  REDIS__PORT: "6379"
  QDRANT__HOST: qdrant
  QDRANT__PORT: "6333"
  MINIO__ENDPOINT: minio:9000
  MINIO__ACCESS_KEY: ${MINIO_ROOT_USER:?set in deploy/.env}
  MINIO__SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in deploy/.env}

services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in deploy/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ragims}
    ports:
      - "3306:3306"
    volumes:
      - prod_mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
        reservations: { memory: 512M }

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - prod_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
        reservations: { memory: 512M }

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in deploy/.env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - prod_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  backend:
    build: ../backend
    working_dir: /app
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers 2 --proxy-headers --forwarded-allow-ips "*"
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }
        reservations: { memory: 256M }

  worker:
    build: ../backend
    working_dir: /app
    command: >
      celery -A app.workers.celery_app worker
      -Q parse,embed,default -l info --concurrency 2 --max-tasks-per-child 50
    environment: *backend-env
    depends_on:
      redis: { condition: service_healthy }
      mysql: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.5", memory: 1G }
        reservations: { memory: 256M }

  flower:
    build: ../backend
    working_dir: /app
    command: celery -A app.workers.celery_app flower --port=5555
    environment: *backend-env
    ports:
      - "5555:5555"
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

volumes:
  prod_mysql_data:
  prod_qdrant_data:
  prod_minio_data:
