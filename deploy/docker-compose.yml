name: ragims

# Local development stack. Brings up all infrastructure (MySQL, Redis, Qdrant,
# MinIO) plus the backend, Celery worker and Flower. Dev credentials use safe
# defaults; override them via `deploy/.env` (see deploy/.env.example).
#
#   cd deploy && docker compose up -d
#
# The infra services are usable immediately. backend / worker / flower become
# fully operational once the FastAPI app (A3) and Celery base (F1) are in place.

x-backend-env: &backend-env
  APP__LOG_LEVEL: "DEBUG"
  OPENAI__API_KEY: ${OPENAI__API_KEY:-}
  OPENAI__BASE_URL: ${OPENAI__BASE_URL:-https://api.openai.com/v1}
  OPENAI__EMBEDDING_MODEL: ${OPENAI__EMBEDDING_MODEL:-text-embedding-3-small}
  OPENAI__EMBEDDING_DIMENSION: ${OPENAI__EMBEDDING_DIMENSION:-1536}
  MYSQL__HOST: mysql
  MYSQL__PORT: "3306"
  MYSQL__USER: root
  MYSQL__PASSWORD: ${MYSQL_ROOT_PASSWORD:-ragims}
  MYSQL__DATABASE: ragims
  REDIS__HOST: redis
  REDIS__PORT: "6379"
  QDRANT__HOST: qdrant
  QDRANT__PORT: "6333"
  MINIO__ENDPOINT: minio:9000
  MINIO__ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO__SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}

services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ragims}
      MYSQL_DATABASE: ragims
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot job: creates the required buckets once MinIO is healthy.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio/init.sh:/init.sh:ro
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  backend:
    build: ../backend
    working_dir: /app
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: ../backend
    working_dir: /app
    volumes:
      - ../backend:/app
    command: celery -A app.core.celery_app worker --loglevel=info
    environment: *backend-env
    depends_on:
      redis: { condition: service_healthy }
      mysql: { condition: service_healthy }
    restart: unless-stopped

  flower:
    build: ../backend
    working_dir: /app
    volumes:
      - ../backend:/app
    command: celery -A app.core.celery_app flower --port=5555
    environment: *backend-env
    ports:
      - "5555:5555"
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data:
  minio_data:
